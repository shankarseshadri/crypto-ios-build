name: Build cryptography for iOS

on:
  workflow_dispatch:
    inputs:
      cryptography_version:
        description: "Exact pyca/cryptography version tag to build (e.g. 50.0.1)"
        required: true
        default: "50.0.1"

jobs:
  build-ios-wheels:
    name: Build iOS wheels (device + simulator)
    runs-on: macos-14
    steps:
      - name: Check out the OFFICIAL pyca/cryptography source at a pinned version
        uses: actions/checkout@v4
        with:
          repository: pyca/cryptography
          ref: ${{ github.event.inputs.cryptography_version }}
          path: cryptography-src
          persist-credentials: false

      - name: Show exactly what commit/tag we're building (audit trail)
        run: |
          cd cryptography-src
          echo "Building pyca/cryptography at tag: ${{ github.event.inputs.cryptography_version }}"
          git rev-parse HEAD
          git log -1 --format="%H %ci %s"

      - name: Patch pyo3 to the official upstream commit with iOS support
        run: |
          cat >> cryptography-src/Cargo.toml << 'EOF'

          # Patch added by this build pipeline, 6 Sept 2026:
          # PyO3's iOS support ("Link with libpython for iOS extension modules",
          # PyO3/pyo3#5605) is merged into PyO3's official main branch but not
          # yet in a numbered crates.io release. This pins to that exact,
          # official, publicly-auditable commit instead of any third party's
          # pre-built binary or fork.
          [patch.crates-io]
          pyo3 = { git = "https://github.com/PyO3/pyo3", rev = "6aee027" }
          EOF
          echo "--- Patched Cargo.toml tail ---"
          tail -10 cryptography-src/Cargo.toml

      - name: Build wheels for iOS (device + simulator, all archs)
        uses: pypa/cibuildwheel@v3.3.1
        with:
          package-dir: cryptography-src
        env:
          CIBW_PLATFORM: ios
          CIBW_BUILD: "cp313-*"

      - name: Upload built wheels as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: cryptography-ios-wheels
          path: ./wheelhouse/*.whl
          retention-days: 30
